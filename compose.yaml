name: devicedock

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-devicedock}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devicedock_local_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit_data:/data
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks: [app]

  migrate:
    build:
      context: ./backend
      target: migration
      no_cache: true
    restart: 'no'
    env_file: ./backend/.env
    networks: [app]

  backend:
    build:
      context: ./backend
      target: runtime
      no_cache: true
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      HOST: ${BACKEND_HOST:-0.0.0.0}
      PORT: ${BACKEND_PORT:-8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-devicedock}:${RABBITMQ_PASSWORD:-devicedock_local_password}@rabbitmq:5672
      NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks: [app]

  frontend:
    build:
      context: ./frontend
      no_cache: true
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is required}
    restart: unless-stopped
    environment:
      NODE_ENV: ${FRONTEND_NODE_ENV:-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080/api/v1}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

networks:
  app:

volumes:
  redis_data:
  rabbitmq_data:
  mailpit_data:
