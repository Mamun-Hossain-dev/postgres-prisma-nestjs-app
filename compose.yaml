name: devicedock

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devicedock
      POSTGRES_PASSWORD: devicedock_121869
      POSTGRES_DB: devicedock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devicedock -d devicedock']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: devicedock
      RABBITMQ_DEFAULT_PASS: devicedock_121869
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit_data:/data
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks: [app]

  migrate:
    build:
      context: ./backend
      target: migration
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://devicedock:devicedock_121869@postgres:5432/devicedock?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://devicedock:devicedock_121869@postgres:5432/devicedock?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://devicedock:devicedock_121869@rabbitmq:5672
      MAIL_ENABLED: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks: [app]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: devicedock-nextauth-secret-121869-local-only
      API_INTERNAL_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

networks:
  app:

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mailpit_data:
