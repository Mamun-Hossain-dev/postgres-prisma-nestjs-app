name: devicedock

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devicedock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devicedock_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-devicedock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-devicedock}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devicedock_local_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devicedock}:${POSTGRES_PASSWORD:-devicedock_local_password}@postgres:5432/${POSTGRES_DB:-devicedock}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-devicedock}:${POSTGRES_PASSWORD:-devicedock_local_password}@postgres:5432/${POSTGRES_DB:-devicedock}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-devicedock}:${RABBITMQ_PASSWORD:-devicedock_local_password}@rabbitmq:5672
    ports:
      - '${PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
